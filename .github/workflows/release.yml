name: legacy-release-disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-amd64-release-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Reject the obsolete public release path
        run: |
          echo "The legacy amd64 packager cannot satisfy the HarborOS K3 component contract."
          echo "Use k3-evt-package.yml and the central signed HarborOS APT snapshot."
          exit 1
