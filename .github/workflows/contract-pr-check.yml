name: Contract PR Check

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - develop

permissions:
  contents: read

env:
  HARBORBEACON_SOUTHBOUND_MODE: harborlink

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust_quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cargo fmt --check
      - run: cargo clippy --lib --tests
      - run: cargo check --locked --bin harboros-beacon --bin agent-hub-admin-api --bin assistant-task-api --bin harbor-model-api --bin benchmark-local-model-backend
      - run: cargo test --lib -- --test-threads=1
      - run: cargo test --locked --bin harboros-beacon -- --test-threads=1
      - run: cargo test --bin agent-hub-admin-api -- --test-threads=1
      - run: cargo test --locked --bin benchmark-local-model-backend spawned_model_api_receives_only_explicit_benchmark_api_key -- --test-threads=1
      - run: cargo test --locked --test service_auth_hardening -- --test-threads=1

  harborlink_package_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify HarborLink dependency and lifecycle metadata
        run: |
          grep -Eq '^Depends:.*harborlink \(>= [0-9]+\.[0-9]+\.[0-9]+\)' debian/control
          grep -F 'harboros-im-gate, harboros-service-auth-abi (>= 1)' debian/control
          grep -F 'harborlink (>= 0.1.0)' scripts/build_harbornavi_k3_deb.sh
          grep -F 'harboros-im-gate, harboros-service-auth-abi (>= 1)' scripts/build_harbornavi_k3_deb.sh
          grep -F 'validate-harborbeacon-service-auth' scripts/build_harbornavi_k3_deb.sh
          grep -F 'ensure-harborbeacon-model-token' scripts/build_harbornavi_k3_deb.sh
          bash -n scripts/build_harbornavi_k3_deb.sh
          bash -n scripts/validate_harbornavi_k3_gate_deb.sh
          bash -n tests/test_harbornavi_k3_gate_companion.sh
          bash tests/test_harbornavi_k3_gate_companion.sh
          grep -F 'User=harborbeacon' debian/harboros-beacon.service
          grep -F 'LoadCredential=harborlink-local-api-token:' debian/harboros-beacon.service
          grep -F 'Requires=harboros-service-auth-recovery.service' debian/harboros-beacon.service
          grep -F 'After=network.target harborlink.target harboros-service-auth-recovery.service' debian/harboros-beacon.service
      - name: Verify AMD64 embedded semantic-router topology
        run: |
          bash -n debian/postinst debian/prerm debian/reconcile-legacy-semantic-router
          bash -n debian/harbornavi-k3/postinst debian/harbornavi-k3/prerm
          python3 -m unittest discover -s tests -p 'test_amd64_semantic_router_topology.py' -v

  cat_recording_release_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run cat recording Rust integration contract
        run: cargo test --locked --test cat_recording_classifier_contract -- --test-threads=1
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - name: Install pinned Python test dependency
        run: python -m pip install numpy==2.2.6
      - name: Run K3 classifier, worker, analyzer, model, and package contracts
        run: python -m unittest discover -s tests -p 'test_k3_*.py' -v

  schema_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bin validate-contract-schemas
      - run: ./target/release/validate-contract-schemas --report validate-contract-report.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        if: always()
        with:
          name: schema-check-report
          path: validate-contract-report.json
